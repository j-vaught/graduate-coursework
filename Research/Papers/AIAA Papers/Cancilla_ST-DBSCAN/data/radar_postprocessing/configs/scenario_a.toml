# Scenario A Configuration
# ========================
# High noise, moderate dropout scenario for stress testing

name = "scenario_a"
description = "High noise and moderate dropout for robustness evaluation"
seed = 42  # Global random seed for reproducibility

[noise]
# Gaussian noise parameters in polar coordinates
sigma_range = 1.5      # Range noise standard deviation (range bins)
sigma_azimuth = 3.0    # Azimuth noise standard deviation (ticks)
# seed = 42           # Optional: use separate seed for noise

[dropout]
# Detection dropout parameters
dropout_rate = 0.15           # 15% probability of dropping object per frame
min_consecutive_frames = 2    # Object must appear in 2 frames before dropout eligible
# seed = 43           # Optional: use separate seed for dropout

[clutter]
# Random clutter generation in water regions
clutter_density = 8.0         # Average 8 clutter points per frame
intensity_min = 180           # Minimum clutter intensity (0-255)
intensity_max = 255           # Maximum clutter intensity (0-255)
cluster_probability = 0.4     # 40% chance clutter appears in clusters
# seed = 44           # Optional: use separate seed for clutter

[conversion]
# Coordinate conversion settings
image_size = 1736             # Square image size (pixels)
intensity_threshold = 10      # Minimum intensity to include in output
