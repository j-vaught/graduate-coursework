# RT-DETR Configuration (Transformer-based, NMS-free)

model:
  name: "RT-DETR"
  variant: "rtdetr-l"          # large variant
  pretrained: true
  num_classes: 2               # background + target

training:
  epochs: 72
  batch_size: 8
  imgsz: 640
  optimizer: "AdamW"
  lr: 0.0001
  weight_decay: 0.0001
  lr_scheduler: "CosineAnnealingLR"
  warmup_epochs: 5
  device: "0"
  workers: 8
  seeds: [42, 123, 456]

augmentation:
  flipud: 0.5
  fliplr: 0.5
  mosaic: 0.5
