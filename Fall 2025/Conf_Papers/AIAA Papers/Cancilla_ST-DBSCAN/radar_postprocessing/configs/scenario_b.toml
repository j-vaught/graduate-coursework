# Scenario B Configuration
# ========================
# Low noise, high dropout scenario for tracking continuity testing

name = "scenario_b"
description = "Low noise with high dropout for continuity stress testing"
seed = 123

[noise]
# Minimal noise for cleaner data
sigma_range = 0.5
sigma_azimuth = 1.0

[dropout]
# High dropout rate to test tracker recovery
dropout_rate = 0.3            # 30% dropout probability
min_consecutive_frames = 3    # More frames required before dropout

[clutter]
# Minimal clutter
clutter_density = 2.0
intensity_min = 200
intensity_max = 255
cluster_probability = 0.2

[conversion]
image_size = 1736
intensity_threshold = 15
