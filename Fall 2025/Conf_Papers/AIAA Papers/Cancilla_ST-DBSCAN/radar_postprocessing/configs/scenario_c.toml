# Scenario C Configuration
# ========================
# Clean data for baseline evaluation

name = "scenario_c"
description = "Minimal degradation for baseline performance measurement"
seed = 999

[noise]
# Very low noise
sigma_range = 0.2
sigma_azimuth = 0.5

[dropout]
# No dropout
dropout_rate = 0.0
min_consecutive_frames = 1

[clutter]
# No clutter
clutter_density = 0.0
intensity_min = 200
intensity_max = 255
cluster_probability = 0.0

[conversion]
image_size = 1736
intensity_threshold = 5
