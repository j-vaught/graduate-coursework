[project]
name = "emch574-hw01-study"
version = "0.1.0"
description = "Reproducible HW01 worked solutions and response plots"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
