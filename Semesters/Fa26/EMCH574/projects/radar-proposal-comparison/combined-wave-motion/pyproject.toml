[project]
name = "wave-motion-radar-evidence"
version = "0.1.0"
description = "Reproducible published-model and measured-radar evidence for EMCH574."
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2"]
authors = [{ name = "J.C. Vaught", email = "jvaught@sc.edu" }]

[dependency-groups]
dev = ["ruff>=0.12", "ty>=0.0.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
