[project]
name = "boat-control-report"
version = "0.1.0"
description = "BlueBoat physical configuration, M200 propulsion, and reproducible motion simulations."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pillow>=11.0"]

[dependency-groups]
dev = ["ruff>=0.12", "ty>=0.0.1"]

[tool.ruff]
line-length = 100

[tool.ty.environment]
python-version = "3.12"
