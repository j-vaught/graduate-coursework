# Morphological Pipeline Configuration
# Otsu binarization -> opening -> connected component extraction

morphological:
  name: "Morphological"
  # Otsu binarization applied automatically
  opening_kernel_size: 3      # structuring element size for opening
  opening_iterations: 1
  closing_kernel_size: 5      # optional closing after opening
  closing_iterations: 1
  min_area: 20                # minimum region area (pixels)
  max_area: 50000             # maximum region area (pixels)
  min_eccentricity: 0.0       # filter by shape
  max_eccentricity: 0.99
