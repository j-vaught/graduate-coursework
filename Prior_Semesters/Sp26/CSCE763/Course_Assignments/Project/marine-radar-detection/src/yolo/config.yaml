# YOLOv11 Detection with SAHI Tiled Inference

model:
  name: "YOLOv11"
  variant: "yolo11m"           # medium variant (standard detection)
  pretrained: true
  task: "detect"

training:
  epochs: 100
  batch_size: 16
  imgsz: 640
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  warmup_epochs: 3
  patience: 20                 # early stopping patience
  device: "0"                  # GPU device
  workers: 8
  seeds: [42, 123, 456]        # 3-seed training

sahi:
  enabled: false
  slice_height: 640
  slice_width: 640
  overlap_height_ratio: 0.2
  overlap_width_ratio: 0.2
  postprocess_type: "NMS"
  postprocess_match_threshold: 0.5

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  flipud: 0.5
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1
