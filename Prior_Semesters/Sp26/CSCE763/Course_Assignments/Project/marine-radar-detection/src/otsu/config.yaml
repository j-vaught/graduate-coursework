# Otsu + SSOTSU Configuration
# Speed-up seed point Otsu method for small target detection

otsu:
  name: "Otsu"
  min_area: 10
  max_area: 50000

ssotsu:
  name: "SSOTSU"
  block_size: 64              # local block size for seed point detection
  seed_threshold_factor: 2.0  # 2.0 (was 1.5): stricter seed selection
  region_grow_threshold: 0.6  # 0.6 (was 0.8): slightly stricter grow
  min_area: 30                # 30 (was 5): filter single-pixel fragments
  max_area: 5000              # (was 50000): hard-cap harbor-wide blobs
