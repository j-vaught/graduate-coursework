# Wavelet Detection Configuration
# 2D Stationary Wavelet Transform for target-clutter separation

wavelet:
  name: "Wavelet-SWT"
  wavelet: "db4"              # wavelet family
  level: 3                    # decomposition levels
  threshold_sigma: 6.0        # 6.0 (was 4.0): fewer but more confident detections
  subbands: ["LH", "HL", "HH"]  # high-frequency subbands to threshold
  combine_mode: "max"         # how to combine subbands: max, sum, or
  min_area: 30                # minimum connected component area
  max_area: 3000              # reject wavelet-halo blobs larger than a typical vessel
