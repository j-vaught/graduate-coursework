# CFAR Detector Configurations
# Guard cells must be larger than half the target size (~15px) to prevent
# target energy from leaking into the reference window.

ca_cfar:
  name: "CA-CFAR"
  guard_cells: [15, 15]       # guard band half-size (covers ~30px target)
  reference_cells: [30, 30]   # reference window half-size
  pfa: 1.0e-3                 # probability of false alarm
  min_area: 50                # minimum connected component area (pixels)

go_cfar:
  name: "GO-CFAR"
  guard_cells: [15, 15]
  reference_cells: [30, 30]
  pfa: 1.0e-3
  min_area: 50

so_cfar:
  name: "SO-CFAR"
  guard_cells: [15, 15]
  reference_cells: [30, 30]
  pfa: 1.0e-3
  min_area: 50

os_cfar:
  name: "OS-CFAR"
  guard_cells: [15, 15]
  reference_cells: [30, 30]
  pfa: 1.0e-3
  k: 0.75
  min_area: 50
