[project]
name = "marine-radar-detection"
version = "0.1.0"
description = "Classical vs. Deep Learning Object Detection in X-Band Marine Radar Imagery"
authors = [
    {name = "J.C. Vaught", email = "jvaught@sc.edu"},
    {name = "Ty Dangerfield"},
]
requires-python = ">=3.10"

dependencies = [
    # Core
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "tqdm",
    "pyyaml",

    # Image processing (classical)
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "PyWavelets>=1.4",

    # Deep learning
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.3",
    "sahi>=0.11",
    "transformers>=4.36",

    # Evaluation
    "pycocotools>=2.0",
    "tidecv>=1.0",

    # Visualization
    "matplotlib>=3.7",
    "seaborn>=0.13",

    # Benchmarking
    "fvcore",
    "thop",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
